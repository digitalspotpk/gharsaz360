<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GharSaz 360 - Smart Home, Property &amp; Life Suite</title>
<meta name="description" content="All-in-one offline home, property, rent, construction, udhar khata and life management suite.">
<meta name="theme-color" content="#059669">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GharSaz 360">
<style>
/* ============================================================
   GharSaz 360 — Design System
   Material You (Android 14) tone + soft glassmorphism accents.
   No external font/icon/CSS-framework dependency: fully self
   contained so the app renders correctly even before the
   service worker has cached anything (true first-load offline
   capability on a local file:// open).
   ============================================================ */
:root{
  --teal-900:#052e2b; --teal-800:#065f46; --teal-700:#0f766e; --teal-600:#059669;
  --teal-500:#10b981; --teal-400:#34d399; --teal-300:#6ee7b7; --teal-100:#d1fae5;
  --amber-500:#f59e0b; --amber-400:#fbbf24;
  --red-500:#ef4444; --red-100:#fee2e2;
  --sky-500:#0ea5e9;
  --violet-500:#8b5cf6;

  --bg:#f2f7f5;
  --surface:#ffffff;
  --surface-2:#eef5f2;
  --text:#0b2b26;
  --text-dim:#4b6b64;
  --border:#dbe8e3;
  --glass-bg: rgba(255,255,255,0.6);
  --glass-border: rgba(255,255,255,0.4);
  --shadow: 0 8px 24px rgba(6,46,38,0.10);
  --shadow-lg: 0 16px 40px rgba(6,46,38,0.16);
  --radius: 18px;
  --radius-sm: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
html.dark{
  --bg:#08201c;
  --surface:#0e2f29;
  --surface-2:#123933;
  --text:#eafff6;
  --text-dim:#8fb8ae;
  --border:#194b42;
  --glass-bg: rgba(14,47,41,0.65);
  --glass-border: rgba(255,255,255,0.08);
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y:contain;
  transition:background .3s ease, color .3s ease;
}
button,input,select,textarea{font-family:inherit; color:inherit;}
::-webkit-scrollbar{width:0;height:0;}
a{color:inherit;text-decoration:none;}

/* ---------- Splash Screen ---------- */
#splash{
  position:fixed; inset:0; z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--teal-800),var(--teal-600) 55%,var(--teal-400));
  color:#fff; transition:opacity .6s ease, filter .6s ease;
}
#splash.hide{opacity:0; filter:blur(12px); pointer-events:none;}
.splash-logo{
  width:112px;height:112px;border-radius:30px;
  background:rgba(255,255,255,.14); backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  animation:pulseLogo 1.6s ease-in-out infinite;
}
@keyframes pulseLogo{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.splash-title{margin-top:22px;font-size:26px;font-weight:800;letter-spacing:.3px;}
.splash-tag{margin-top:6px;font-size:13px;color:#d1fae5;opacity:.9;text-align:center;padding:0 40px;}
.splash-bar{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin-top:26px;overflow:hidden;}
.splash-bar::after{content:'';display:block;height:100%;width:40%;background:#fff;border-radius:4px;animation:loadBar 1.2s ease-in-out infinite;}
@keyframes loadBar{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}

/* ---------- App Shell ---------- */
#app{display:none; min-height:100%; padding-bottom:calc(84px + var(--safe-bottom));}
#app.ready{display:block;}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:calc(14px + var(--safe-top)) 16px 14px;
  background:var(--glass-bg); backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--border);
}
.topbar h1{font-size:18px;margin:0;font-weight:800;flex:1;}
.topbar .sub{font-size:11px;color:var(--text-dim);font-weight:500;}
.icon-btn{
  width:40px;height:40px;border-radius:14px;border:none;
  background:var(--surface-2); display:flex;align-items:center;justify-content:center;
  cursor:pointer; transition:transform .15s ease, background .2s;
}
.icon-btn:active{transform:scale(.9);}

main.view{padding:16px; max-width:640px; margin:0 auto; animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); margin-bottom:14px;
}
.glass{
  background:var(--glass-bg); backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid var(--glass-border);
}
.card-row{display:flex; align-items:center; gap:12px;}
.card-title{font-weight:800;font-size:15px;margin:0;}
.card-sub{font-size:12px;color:var(--text-dim);margin:2px 0 0;}
.badge{
  font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
  background:var(--surface-2); color:var(--text-dim); white-space:nowrap;
}
.badge.green{background:#d1fae5;color:#065f46;}
.badge.amber{background:#fef3c7;color:#92400e;}
.badge.red{background:#fee2e2;color:#991b1b;animation:badgePulse 2s ease-in-out infinite;}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.25);}50%{box-shadow:0 0 0 5px rgba(220,38,38,0);}}
html.dark .badge.green{background:#08382c;color:#6ee7b7;}
html.dark .badge.amber{background:#3a2c07;color:#fbbf24;}
html.dark .badge.red{background:#3a1010;color:#fca5a5;}

.section-title{
  font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
  color:var(--text-dim); margin:22px 0 10px;
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}

.stat-card{
  border-radius:var(--radius); padding:16px; color:#fff;
  background:linear-gradient(135deg,var(--teal-700),var(--teal-500));
  box-shadow:var(--shadow-lg); position:relative; overflow:hidden;
  animation:cardIn .45s cubic-bezier(.2,.9,.3,1);
}
.stat-card::after{
  content:''; position:absolute; top:0; left:-60%; width:50%; height:100%;
  background:linear-gradient(115deg, transparent, rgba(255,255,255,.16), transparent);
  animation:shimmer 3.2s ease-in-out infinite;
}
@keyframes shimmer{0%{left:-60%;}100%{left:130%;}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.stat-card .stat-label{font-size:12px;opacity:.85;font-weight:600;}
.stat-card .stat-value{font-size:24px;font-weight:800;margin-top:6px;}
.stat-card.warn{background:linear-gradient(135deg,#b45309,#f59e0b);}
.stat-card.danger{background:linear-gradient(135deg,#991b1b,#ef4444);}
.stat-card.blue{background:linear-gradient(135deg,#075985,#0ea5e9);}

.module-tile{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:14px 8px; border-radius:16px; background:var(--surface);
  border:1px solid var(--border); cursor:pointer; transition:transform .15s, box-shadow .2s;
}
.module-tile:active{transform:scale(.94); box-shadow:0 0 0 3px rgba(16,185,129,.2);}
.module-tile .ic{
  width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  transition:transform .2s ease;
}
.module-tile:active .ic{transform:scale(1.08);}
.module-tile span{font-size:11px;font-weight:700;text-align:center;line-height:1.2;}

.progress{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
.progress > div{height:100%;border-radius:6px;transition:width .5s ease;}
.progress.green > div{background:linear-gradient(90deg,var(--teal-500),var(--teal-400));}
.progress.amber > div{background:linear-gradient(90deg,#f59e0b,#fbbf24);}
.progress.red > div{background:linear-gradient(90deg,#dc2626,#ef4444);}

/* ---------- Buttons ---------- */
.btn{
  border:none; border-radius:14px; padding:12px 18px; font-weight:700; font-size:14px;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .15s ease, filter .15s ease;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--teal-600),var(--teal-500));color:#fff;box-shadow:0 8px 20px rgba(5,150,105,.35);transition:transform .15s ease, box-shadow .2s ease;}
.btn-primary:active{box-shadow:0 4px 14px rgba(5,150,105,.5), 0 0 0 4px rgba(16,185,129,.18);}
.btn-block{width:100%;}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-danger{background:#fee2e2;color:#991b1b;}
html.dark .btn-danger{background:#3a1010;color:#fca5a5;}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:10px;}

.fab{
  position:fixed; right:18px; bottom:calc(96px + var(--safe-bottom)); z-index:45;
  width:56px;height:56px;border-radius:20px; border:none;
  background:linear-gradient(135deg,var(--teal-600),var(--teal-400)); color:#fff;
  display:flex;align-items:center;justify-content:center; box-shadow:0 12px 28px rgba(5,150,105,.45);
  cursor:pointer; transition:transform .2s ease, box-shadow .3s ease;
  animation:fabGlow 2.6s ease-in-out infinite;
}
@keyframes fabGlow{
  0%,100%{box-shadow:0 12px 28px rgba(5,150,105,.45), 0 0 0 0 rgba(16,185,129,.35);}
  50%{box-shadow:0 12px 32px rgba(5,150,105,.55), 0 0 0 10px rgba(16,185,129,0);}
}
.fab:active{transform:scale(.9) rotate(90deg); animation:none;}
.fab-wa{
  position:fixed; left:14px; bottom:calc(90px + var(--safe-bottom)); z-index:45;
  width:44px;height:44px;border-radius:50%; border:none; background:#25D366; color:#fff;
  display:flex;align-items:center;justify-content:center; box-shadow:0 10px 20px rgba(37,211,102,.45);
  cursor:pointer; opacity:.92; transition:transform .2s ease;
  animation:waGlow 2.6s ease-in-out infinite .4s;
}
@keyframes waGlow{
  0%,100%{box-shadow:0 10px 20px rgba(37,211,102,.45), 0 0 0 0 rgba(37,211,102,.4);}
  50%{box-shadow:0 10px 24px rgba(37,211,102,.55), 0 0 0 8px rgba(37,211,102,0);}
}
.fab-wa:active{transform:scale(.88); animation:none;}
.fab-wa svg{width:22px;height:22px;}

/* ---------- Bottom Nav ---------- */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:44;
  display:flex; justify-content:space-around; align-items:center;
  padding:8px 6px calc(8px + var(--safe-bottom));
  background:var(--glass-bg); backdrop-filter:blur(16px) saturate(1.4);
  border-top:1px solid var(--border);
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
  color:var(--text-dim); font-size:10px; font-weight:700; padding:6px 10px; border-radius:12px;
  cursor:pointer; transition:color .2s, background .2s;
}
.nav-item.active{color:var(--teal-600);}
html.dark .nav-item.active{color:var(--teal-300);}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:1px;transition:box-shadow .3s;}
.nav-item.active .dot{background:currentColor;box-shadow:0 0 8px currentColor;}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border);
  background:var(--surface-2); font-size:14px; outline:none; transition:border .2s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal-500);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

/* ---------- Modal / Sheet ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(4,20,17,.55); z-index:60;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .25s ease;
}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
  background:var(--surface); border-radius:24px 24px 0 0;
  padding:10px 18px calc(22px + var(--safe-bottom));
  transform:translateY(30px); transition:transform .3s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 -20px 60px rgba(0,0,0,.3);
}
.overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:8px auto 14px;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-header h2{font-size:17px;margin:0;font-weight:800;}

/* ---------- Misc ---------- */
.empty{
  text-align:center; padding:40px 20px; color:var(--text-dim);
}
.empty .ic{width:56px;height:56px;margin:0 auto 12px;opacity:.5;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.chip{
  flex:none; padding:8px 14px; border-radius:999px; background:var(--surface-2);
  font-size:12px; font-weight:700; cursor:pointer; border:1.5px solid transparent; white-space:nowrap;
}
.chip.active{background:var(--teal-600); color:#fff;}
.list-item{
  display:flex; align-items:center; gap:12px; padding:12px 6px; border-bottom:1px solid var(--border);
}
.list-item:last-child{border-bottom:none;}
.list-item .avatar{
  width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;
}
.list-item .meta{flex:1; min-width:0;}
.list-item .meta .t{font-weight:700;font-size:14px; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-item .meta .s{font-size:12px;color:var(--text-dim);}
.list-item .amt{font-weight:800;font-size:14px;white-space:nowrap;}
.toast{
  position:fixed; left:50%; bottom:calc(140px + var(--safe-bottom)); transform:translateX(-50%) translateY(20px);
  background:var(--text); color:var(--bg); padding:12px 20px; border-radius:14px; font-size:13px; font-weight:700;
  z-index:80; opacity:0; transition:all .3s ease; box-shadow:var(--shadow-lg); max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.ring-wrap{position:relative;width:88px;height:88px;flex:none;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-wrap .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.help-text{font-size:11px;color:var(--text-dim);margin-top:4px;}
kbd{background:var(--surface-2);padding:2px 6px;border-radius:6px;font-size:11px;}
@media (min-width:640px){
  .fab{right:calc(50% - 320px + 18px);}
  .fab-wa{left:calc(50% - 320px + 18px);}
}

/* ---------- Pull to Refresh ---------- */
#pullIndicator{
  position:fixed; top:0; left:50%; transform:translate(-50%,-60px) rotate(0deg);
  width:42px;height:42px;border-radius:50%;
  background:var(--surface); box-shadow:var(--shadow-lg); color:var(--teal-600);
  display:flex;align-items:center;justify-content:center;
  z-index:70; opacity:0; transition:opacity .2s ease;
  pointer-events:none;
}
#pullIndicator.visible{opacity:1;}
#pullIndicator.spinning svg{animation:ptrSpin .8s linear infinite;}
@keyframes ptrSpin{to{transform:rotate(360deg);}}

/* ---------- Print / PDF export ---------- */
#printArea{display:none;}
@media print{
  body *{visibility:hidden !important;}
  #printArea, #printArea *{visibility:visible !important;}
  #printArea{
    display:block !important; position:absolute; left:0; top:0; width:100%;
    padding:24px; color:#111; background:#fff;
  }
  #printArea h1{font-size:20px;margin:0 0 4px;color:#065f46;}
  #printArea .print-date{font-size:11px;color:#666;margin-bottom:18px;}
  #printArea h2{font-size:14px;margin:20px 0 8px;color:#065f46;border-bottom:1px solid #ccc;padding-bottom:4px;}
  #printArea table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;}
  #printArea th, #printArea td{border:1px solid #ddd;padding:6px 8px;text-align:left;}
  #printArea th{background:#f0fdf4;color:#065f46;}
  #printArea .print-empty{font-size:12px;color:#888;font-style:italic;}
  #printArea .print-footer{margin-top:24px;font-size:10px;color:#999;text-align:center;}
}
</style>
</head>
<body>

<!-- Pull-to-refresh indicator -->
<div id="pullIndicator">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
</div>

<!-- ================= SPLASH SCREEN ================= -->
<div id="splash">
  <div class="splash-logo">
    <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
      <path d="M8 28L30 10L52 28" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 24V48C14 49.1 14.9 50 16 50H44C45.1 50 46 49.1 46 48V24" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="25" y="34" width="10" height="16" rx="1.5" fill="#fff"/>
    </svg>
  </div>
  <div class="splash-title">GharSaz 360</div>
  <div class="splash-tag">Smart Home, Property &amp; Life Suite</div>
  <div class="splash-bar"></div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app">

  <div class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px">
        <h1 id="pageTitle">Dashboard</h1>
        <span id="connBadge" class="badge green" style="font-size:9px;padding:2px 8px">Live</span>
      </div>
      <div class="sub" id="pageSub">Aaj ka khulasa</div>
    </div>
    <button class="icon-btn" id="pdfBtn" aria-label="Download PDF"></button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
  </div>

  <main class="view" id="viewRoot"></main>
</div>

<!-- Print-only area, used to generate PDF via the browser's native print dialog -->
<div id="printArea"></div>

<!-- Floating actions -->
<button class="fab" id="fabAdd" aria-label="Add"></button>
<button class="fab-wa" id="fabWa" aria-label="WhatsApp Support"></button>

<!-- Bottom nav -->
<nav class="bottomnav" id="bottomNav"></nav>

<!-- Modal sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Full-screen error overlay: shown for uncaught errors, storage failures, etc. -->
<div id="errorScreen" style="display:none;position:fixed;inset:0;z-index:9998;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;">
  <div style="width:76px;height:76px;border-radius:22px;background:#fee2e2;display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
  </div>
  <div id="errorTitle" style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:8px;">Kuch Ghalat Ho Gaya</div>
  <div id="errorMsg" style="font-size:13px;color:var(--text-dim);max-width:320px;margin-bottom:22px;line-height:1.6;">
    Ek unexpected error aa gayi hai. Aapka data mehfooz hai — app reload karke dobara try karein.
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-primary" onclick="location.reload()">Reload App</button>
    <button class="btn btn-outline" onclick="document.getElementById('errorScreen').style.display='none'">Wapis Jayen</button>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
